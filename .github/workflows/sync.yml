name: Sync catalogue

# Refreshes data/titles.js with the latest Hindi + English releases.
# Add TMDB_API_KEY (required) and OMDB_API_KEY (optional, for true IMDb
# ratings) as repository secrets: Settings → Secrets → Actions.

on:
  schedule:
    - cron: "30 1 * * *" # daily, 07:00 IST — full sync: new releases, posters,
                         # IMDb ids & exact ratings, certs, episodes
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Discover new releases (Gemini + Google Search)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then node scripts/discover.mjs || echo "discover failed (non-fatal)"; else echo "no GEMINI_API_KEY — skipping"; fi
      - name: Sync from TMDB (optional)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          if [ -n "$TMDB_API_KEY" ]; then node scripts/sync.mjs; else echo "no TMDB_API_KEY — skipping"; fi
      - name: Enrich new titles (posters, cast, IMDb ids)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then node scripts/enrich.mjs --only-missing || echo "enrich failed (non-fatal)"; else echo "no GEMINI_API_KEY — skipping"; fi
      - name: Commit & push if changed
        run: |
          git config user.name "binge-bot"
          git config user.email "actions@github.com"
          git add data/titles.js data/sync-stats.json
          git diff --cached --quiet || git commit -m "chore: daily catalogue sync"
          # the job runs ~1h — main may have moved; rebase our data commit on
          # top (ours-vs-theirs: keep the freshly synced catalogue on conflict)
          git pull --rebase -X theirs origin main
          git push
